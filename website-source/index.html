(function(){
  var lastVoiceTabClick = 0;
  var lastSpokenKey = '';
  var lastSpeakAt = 0;

  function activeTabLabel(){
    var active = document.querySelector('.report-tab.active');
    return active && active.textContent ? active.textContent.trim() : '';
  }

  function isVoiceTab(label){
    return label === 'Team 1' || label === 'Team 4' || label === 'Team 5';
  }

  function spanishBayLabel(label){
    if (label === 'Team 1') return 'Bahía uno';
    if (label === 'Team 5') return 'Bahía cinco';
    return 'Bahía cuatro';
  }

  function pickPreferredVoice(){
    if (!("speechSynthesis" in window)) return null;
    var voices = window.speechSynthesis.getVoices();
    return (
      voices.find(function(v){ return /elvira|helena|monica|paulina|sabina|lucia|carmen|maria|latina/i.test(v.name || ''); }) ||
      voices.find(function(v){ return /^es[-_]/i.test(v.lang || ''); }) ||
      voices.find(function(v){ return /zira|samantha|jenny|aria|ava|victoria|karen/i.test(v.name || ''); }) ||
      voices.find(function(v){ return /^en[-_]/i.test(v.lang || ''); }) ||
      voices[0] || null
    );
  }

  function pickEnglishFemaleVoice(){
    if (!("speechSynthesis" in window)) return null;
    var voices = window.speechSynthesis.getVoices();
    var notMale = function(v){ return !/male|hombre|jorge|diego|carlos|juan|miguel|pablo|raul|enrique/i.test(v.name || ''); };
    return (
      voices.find(function(v){ return notMale(v) && /^en[-_]/i.test(v.lang || '') && /zira|samantha|jenny|aria|ava|victoria|karen|moira|tessa|susan|lisa|fiona/i.test(v.name || ''); }) ||
      voices.find(function(v){ return notMale(v) && /^en[-_]/i.test(v.lang || '') && /female|woman|natural|premium/i.test(v.name || ''); }) ||
      voices.find(function(v){ return notMale(v) && /^en[-_]/i.test(v.lang || ''); }) ||
      voices.find(function(v){ return /zira|samantha|jenny|aria|ava|victoria|karen|moira|tessa|susan|lisa|fiona/i.test(v.name || ''); }) ||
      voices[0] || null
    );
  }

  function makeUtterance(message, lang){
    if (!("SpeechSynthesisUtterance" in window)) return null;
    var u = new SpeechSynthesisUtterance(message);
    u.lang = lang;
    u.rate = /^es/i.test(lang) ? 0.88 : 0.86;
    u.pitch = 1.06;
    u.volume = 1;
    var voice = /^en/i.test(lang) ? pickEnglishFemaleVoice() : pickPreferredVoice();
    if (voice) u.voice = voice;
    return u;
  }

  function speakEnglishAndSpanish(englishMessage, spanishMessage){
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    var en = makeUtterance(englishMessage, 'en-US');
    var es = makeUtterance(spanishMessage, 'es-ES');
    if (en) window.speechSynthesis.speak(en);
    if (es) window.speechSynthesis.speak(es);
  }

  function speakTabData(data){
    var label = activeTabLabel();
    if (!isVoiceTab(label) || !data) return;
    var yard = data.inYardFullEquipment && data.inYardFullEquipment.supported ? (data.inYardFullEquipment.rows || []).length : 'pending';
    var planned = data.plannedOrders && data.plannedOrders.supported ? (data.plannedOrders.rows || []).length : 'pending';
    var key = label + '|' + yard + '|' + planned + '|' + (data.refreshedAt || data.generatedAt || '');
    var now = Date.now();
    if (key === lastSpokenKey && now - lastSpeakAt < 2500) return;
    lastSpokenKey = key;
    lastSpeakAt = now;
    var english = label + '. In yard full equipment: ' + yard + '. Planned orders: ' + planned + '.';
    var spanish = spanishBayLabel(label) + '. Equipo lleno en patio: ' + yard + '. Órdenes planificadas: ' + planned + '.';
    setTimeout(function(){ speakEnglishAndSpanish(english, spanish); }, 120);
  }

  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = function(){ pickEnglishFemaleVoice(); pickPreferredVoice(); };
  }

  document.addEventListener('click', function(e){
    var btn = e.target && e.target.closest ? e.target.closest('button') : null;
    if (!btn) return;
    var label = (btn.textContent || '').trim();
    if (isVoiceTab(label) || (label.indexOf('Refresh') >= 0 && isVoiceTab(activeTabLabel()))) {
      lastVoiceTabClick = Date.now();
    }
  }, true);

  })();

(function(){
  var latestCounts = {};

  function activeTabLabel(){
    var active = document.querySelector('.report-tab.active');
    return active && active.textContent ? active.textContent.trim() : 'default';
  }

  function cleanName(text){
    return String(text || '').replace(/\s*\(\d+\)\s*$/, '').trim();
  }

  function buildCounts(payload){
    var rows = [];
    if (payload && payload.plannedOrders && Array.isArray(payload.plannedOrders.rows)) rows = payload.plannedOrders.rows;
    if (payload && payload.bay2 && Array.isArray(payload.bay2.detailRows)) rows = payload.bay2.detailRows;
    if (!rows.length) return null;
    var counts = {};
    rows.forEach(function(row){
      var name = row.customer || row.customerName || row.label;
      if (!name) return;
      counts[name] = (counts[name] || 0) + 1;
    });
    return counts;
  }

  function applyCounts(){
    var tab = activeTabLabel();
    var counts = latestCounts[tab] || latestCounts.default;
    if (!counts) return;
    var chips = document.querySelectorAll('.chips button, .chip');
    chips.forEach(function(chip){
      var base = cleanName(chip.textContent);
      if (!base) return;
      var count = counts[base];
      if (count == null) {
        var baseNorm = base.toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
        Object.keys(counts).some(function(name){
          var nameNorm = name.toUpperCase().replace(/[^A-Z0-9]+/g, ' ').trim();
          if (nameNorm === baseNorm || nameNorm.indexOf(baseNorm) >= 0 || baseNorm.indexOf(nameNorm) >= 0) {
            count = counts[name];
            return true;
          }
          return false;
        });
      }
      if (count != null) chip.textContent = base + ' (' + count + ')';
    });
  }


  })();

(function(){
  var latestBay2AutoAssign = null;

  function activeTabLabel(){
    var active = document.querySelector('.report-tab.active');
    return active && active.textContent ? active.textContent.trim() : '';
  }

  function setCardValue(label, value){
    document.querySelectorAll('.bay4-assign-kpis article, .bay4-reference-kpis article').forEach(function(card){
      var span = card.querySelector('span');
      if (!span) return;
      if ((span.textContent || '').trim() === label) {
        var strong = card.querySelector('strong');
        if (strong) strong.textContent = String(value);
      }
    });
  }

  function applyBay2AutoAssignKpis(){
    var activeLabel = activeTabLabel();
    if ((activeLabel !== 'Team 2 Auto Assign' && activeLabel !== 'E-Comm Auto Assign') || !latestBay2AutoAssign) return;
    var data = latestBay2AutoAssign.bay2AutoAssign || {};
    var history = Array.isArray(data.historyTasks) ? data.historyTasks : [];
    var active = Array.isArray(data.pickTasks) ? data.pickTasks : [];
    var allAssignmentsToday = history.length || active.length || (Array.isArray(data.assignments) ? data.assignments.length : 0);
    var inProgress = active.filter(function(t){
      return String(t.status || '').toUpperCase() === 'IN_PROGRESS';
    }).length;
    if (!inProgress && history.length) {
      inProgress = history.filter(function(t){ return String(t.status || '').toUpperCase() === 'IN_PROGRESS'; }).length;
    }
    setCardValue('Total Assignments', allAssignmentsToday);
    setCardValue('Active Assignees', inProgress);
  }

  
  setInterval(applyBay2AutoAssignKpis, 1500);
})();

<script id="ruben-live-dashboard-counts-fix">
(function(){
  if (window.__rubenCountsFixApplied) return;
  window.__rubenCountsFixApplied = true;
  var latestCounts = {};
  function norm(v){ return String(v||'').toUpperCase().replace(/&/g,'AND').replace(/[^A-Z0-9]+/g,' ').trim(); }
  function clean(v){ return String(v||'').replace(/\s*\(\d+\)\s*$/,'').trim(); }
  function activeTab(){ var a=document.querySelector('.report-tab.active'); return a && a.textContent ? a.textContent.trim() : 'default'; }
  function buildCounts(payload){
    var rows=[];
    if(payload && payload.plannedOrders && Array.isArray(payload.plannedOrders.rows)) rows=payload.plannedOrders.rows;
    if(payload && payload.bay2 && Array.isArray(payload.bay2.detailRows)) rows=payload.bay2.detailRows;
    var counts={};
    rows.forEach(function(r){ var name=r.customer||r.customerName||r.label; if(!name) return; var k=norm(name); counts[k]=(counts[k]||0)+1; });
    return counts;
  }
  function labelWithCount(text, counts){
    var base=clean(text); if(!base) return text;
    var count=counts[norm(base)];
    if(count==null){
      Object.keys(counts).some(function(k){ var b=norm(base); if(k===b || k.indexOf(b)>=0 || b.indexOf(k)>=0){ count=counts[k]; return true;} return false; });
    }
    return count!=null ? base+' ('+count+')' : base;
  }
  function applyCounts(){
    var counts=latestCounts[activeTab()]||latestCounts.default;
    if(!counts || !Object.keys(counts).length) return;
    document.querySelectorAll('.chips button,.chip').forEach(function(chip){ chip.textContent=labelWithCount(chip.textContent, counts); });
    document.querySelectorAll('table').forEach(function(table){
      var ths=Array.from(table.querySelectorAll('thead th'));
      var idx=ths.findIndex(function(th){ return /customer/i.test(th.textContent||''); });
      if(idx<0) return;
      table.querySelectorAll('tbody tr').forEach(function(tr){
        var tds=tr.querySelectorAll('td'); if(!tds[idx]) return;
        tds[idx].textContent=labelWithCount(tds[idx].textContent, counts);
      });
    });
  }
  window.__setRubenDashboardCounts=function(payload){ var c=buildCounts(payload); latestCounts[activeTab()]=c; latestCounts.default=c; setTimeout(applyCounts,50); setTimeout(applyCounts,500); setTimeout(applyCounts,1500); };
  var oldFetch=window.fetch;
  window.fetch=function(){
    return oldFetch.apply(this,arguments).then(function(res){
      try{
        var url=String(arguments[0]&&arguments[0].url||arguments[0]||'');
        if(url.indexOf('/api/dashboard')>=0){
          res.clone().json().then(function(json){ window.__setRubenDashboardCounts(json); }).catch(function(){});
        }
      }catch(e){}
      return res;
    }.bind(arguments));
  };
  document.addEventListener('click',function(){ setTimeout(applyCounts,300); },true);
  setInterval(applyCounts,1000);
})();
</script>

<script id="planned-customer-chip-filter">
(function(){
  if (window.__plannedCustomerChipFilterApplied) return;
  window.__plannedCustomerChipFilterApplied = true;
  var selectedBySection = new WeakMap();
  function norm(v){ return String(v||'').toUpperCase().replace(/\s*\(\d+\)\s*$/,'').replace(/[^A-Z0-9]+/g,' ').trim(); }
  function label(v){ return String(v||'').replace(/\s*\(\d+\)\s*$/,'').trim(); }
  function plannedSections(){
    return Array.from(document.querySelectorAll('h2,h3')).map(function(head){
      if((head.textContent||'').trim() !== 'Section 2 - PLANNED Outbound Orders') return null;
      var section=head;
      while(section && section!==document.body){
        if(section.querySelector && section.querySelector('.chips') && section.querySelector('table')) return section;
        section=section.parentElement;
      }
      return null;
    }).filter(Boolean);
  }
  function customerColumn(table){
    return Array.from(table.querySelectorAll('thead th')).findIndex(function(th){ return /customer/i.test(th.textContent||''); });
  }
  function applySection(section){
    var chipsWrap=section.querySelector('.chips');
    var table=section.querySelector('table');
    if(!chipsWrap || !table) return;
    var idx=customerColumn(table);
    if(idx<0) return;
    var rows=Array.from(table.querySelectorAll('tbody tr'));
    var counts={};
    rows.forEach(function(row){
      var cell=row.querySelectorAll('td')[idx];
      var customer=label(cell ? cell.textContent : '');
      if(customer) counts[customer]=(counts[customer]||0)+1;
    });
    var selected=selectedBySection.get(section)||'ALL';
    if(selected!=='ALL' && !Object.keys(counts).some(function(name){ return norm(name)===selected; })) selected='ALL';
    selectedBySection.set(section, selected);
    rows.forEach(function(row){
      var cell=row.querySelectorAll('td')[idx];
      var customer=norm(cell ? cell.textContent : '');
      row.style.display=(selected==='ALL' || customer===selected) ? '' : 'none';
    });
    Array.from(chipsWrap.querySelectorAll('button,.chip')).forEach(function(chip){
      var base=label(chip.textContent);
      var key=norm(base);
      chip.dataset.customerKey=key;
      chip.classList.toggle('active', selected!=='ALL' && key===selected);
      if(counts[base]!=null) chip.textContent=base+' ('+counts[base]+')';
    });
  }
  function applyAll(){ plannedSections().forEach(applySection); }
  document.addEventListener('click', function(e){
    var chip=e.target && e.target.closest ? e.target.closest('.chips button,.chips .chip') : null;
    if(!chip) return;
    var section=chip.closest('section,.report-section') || chip.parentElement;
    while(section && section!==document.body && !(section.querySelector && section.querySelector('table') && section.querySelector('.chips'))){
      section=section.parentElement;
    }
    if(!section) return;
    var key=chip.dataset.customerKey || norm(chip.textContent);
    selectedBySection.set(section, selectedBySection.get(section)===key ? 'ALL' : key);
    setTimeout(function(){ applySection(section); },0);
  }, true);
  applyAll();
  document.addEventListener('click', function(){ setTimeout(applyAll,250); }, true);
  setInterval(applyAll,1000);
})();
</script>

<script id="bay3-exact-excel-layout-v2">
(function(){
  if (window.__bay3ExactExcelLayoutV2) return;
  window.__bay3ExactExcelLayoutV2 = true;
  var bay3Rows = null;
  var lastFetchAt = 0;
  var fetching = false;

  function isBay3(){
    var active = document.querySelector('.report-tab.active');
    return active && (active.textContent || '').trim() === 'Team 3';
  }
  function esc(v){ return String(v == null ? '' : v).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
  function dateOnly(v){
    if(!v) return '';
    var s=String(v);
    if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(5,7)+'/'+s.slice(8,10)+'/'+s.slice(0,4);
    try { var d=new Date(v); if(!isNaN(d.getTime())) return d.toLocaleDateString('en-US'); } catch(e){}
    return s.slice(0,10);
  }
  function timeOnly(v){
    if(!v) return '';
    try { var d=new Date(v); if(!isNaN(d.getTime())) return d.toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'}); } catch(e){}
    var s=String(v); return (s.split('T')[1] || s).slice(0,8);
  }
  function findSection2(){
    var heads = Array.from(document.querySelectorAll('h2,h3'));
    var head = heads.find(function(h){
      var t=(h.textContent || '').toUpperCase();
      return t.indexOf('SECTION 2') >= 0 && t.indexOf('PLANNED OUTBOUND ORDERS') >= 0;
    });
    if(!head) return null;
    var node=head;
    while(node && node !== document.body){
      if(node.querySelector && node.querySelector('table')) return node;
      node=node.parentElement;
    }
    return null;
  }
  function value(r, keys){
    for(var i=0;i<keys.length;i++){
      var v=r[keys[i]];
      if(v !== undefined && v !== null && String(v) !== '') return v;
    }
    return '';
  }
  function render(){
    if(!isBay3() || !bay3Rows) return;
    var section = findSection2();
    if(!section) return;
    var table = section.querySelector('table');
    if(!table) return;
    var thead = table.querySelector('thead');
    var tbody = table.querySelector('tbody');
    if(!thead || !tbody) return;

    var headers = ['Customer','Order Number','Load #','Order Status','AppointmentDate','AppointmentTime','Schedule Date','Staging Location','Total Base QTY','Pallet Qty'];
    thead.innerHTML = '<tr>' + headers.map(function(h){ return '<th data-bay3-exact="1">'+h+'</th>'; }).join('') + '</tr>';
    tbody.innerHTML = bay3Rows.map(function(r){
      var appt = value(r, ['appointmentTime','appointmentDate','appointment']);
      var vals = [
        value(r, ['customer','customerName']),
        value(r, ['orderNumber','orderNo','orderId']),
        value(r, ['loadNo','loadNumber','loadId','loadID']),
        value(r, ['status','orderStatus']),
        dateOnly(appt || value(r, ['scheduleDate'])),
        timeOnly(appt),
        dateOnly(value(r, ['scheduleDate','desiredScheduleDate'])),
        value(r, ['stagingLocation','stagingLocations','staging']),
        value(r, ['baseQty','totalBaseQty','totalBaseQTY']),
        value(r, ['palletQty','palletQTY','palletQuantity'])
      ];
      return '<tr data-bay3-exact-row="1">' + vals.map(function(v){ return '<td>'+esc(v || '')+'</td>'; }).join('') + '</tr>';
    }).join('');
  }
  async function fetchBay3(){
    if(!isBay3() || fetching) return;
    if(Date.now() - lastFetchAt < 8000 && bay3Rows){ render(); return; }
    var raw = localStorage.getItem('bay4-wms-session');
    if(!raw) return;
    var session; try { session = JSON.parse(raw); } catch(e){ return; }
    var facilityId = localStorage.getItem('bay4-wms-facility') || (session.defaultFacility && session.defaultFacility.id) || 'LT_F1';
    var facility = (session.facilities || []).find(function(f){ return f.id === facilityId; }) || { id: facilityId, timeZone: 'America/Los_Angeles' };
    fetching = true;
    try {
      var res = await fetch('/api/dashboard/bay3', {
        method: 'POST', cache: 'no-store',
        headers: {
          'content-type': 'application/json',
          'authorization': 'Bearer ' + session.accessToken,
          'x-tenant-id': (session.identity && (session.identity.tenantId || session.identity.tenant_id)) || 'LT'
        },
        body: JSON.stringify({ facilityId: facility.id, facilityName: facility.name, includeAllCustomers: /fontana|aless/i.test((facility.id || '') + ' ' + (facility.name || '')), timeZone: facility.timeZone || 'America/Los_Angeles', tab: 'bay3' })
      });
      var json = await res.json();
      if(json && json.plannedOrders && Array.isArray(json.plannedOrders.rows)){
        bay3Rows = json.plannedOrders.rows;
        lastFetchAt = Date.now();
        render();
      }
    } catch(e) { console.warn('Team 3 exact layout refresh failed', e); }
    fetching = false;
  }
  setInterval(function(){ if(isBay3()){ fetchBay3(); render(); } }, 900);
  document.addEventListener('click', function(){ setTimeout(function(){ if(isBay3()) fetchBay3(); }, 250); }, true);
})();
</script>

<script id="nightshift-customer-summary">
(function(){
  if (window.__nightShiftCustomerSummaryApplied) return;
  window.__nightShiftCustomerSummaryApplied = true;
  var selectedCustomer = 'ALL';
  function norm(v){ return String(v||'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim(); }
  function allowedCustomer(v){ var n=norm(v); return n === norm('ALL MARKET INC / VITA COCO') || n === norm('SIMPLE MODERN'); }
  function isNightShift(){ var a=document.querySelector('.report-tab.active'); return a && /Night Shift/i.test(a.textContent||''); }
  function applyNightShiftCustomerSummary(){
    if(!isNightShift()) return;
    var titleText='Night Shift - Full to Offload Containers';
    var title=Array.from(document.querySelectorAll('h2,h3')).find(function(h){ return norm(h.textContent).indexOf(norm(titleText))>=0 || /Night Shift.*FULL Trailers.*Containers/i.test(h.textContent||''); });
    if(!title) return;
    var section=title;
    while(section && section!==document.body){ if(section.querySelector && section.querySelector('table')) break; section=section.parentElement; }
    if(!section || section===document.body) return;
    var table=section.querySelector('table');
    if(!table) return;
    var headers=Array.from(table.querySelectorAll('thead th'));
    var customerIdx=headers.findIndex(function(th){ return /customer/i.test(th.textContent||''); });
    if(customerIdx<0) return;
    var counts={};
    var rows=Array.from(table.querySelectorAll('tbody tr'));
    rows.forEach(function(tr){
      var cells=tr.querySelectorAll('td');
      var customer=cells[customerIdx] ? cells[customerIdx].textContent.trim() : '';
      if(norm(customer)===norm(titleText)){
        tr.style.display='none';
        return;
      }
      if(!allowedCustomer(customer)){
        tr.style.display='none';
        return;
      }
      if(customer){ counts[customer]=(counts[customer]||0)+1; }
    });
    var selectedStillExists = selectedCustomer === 'ALL' || Object.keys(counts).some(function(name){ return norm(name) === selectedCustomer; });
    if(!selectedStillExists) selectedCustomer = 'ALL';
    var visible=0;
    rows.forEach(function(tr){
      var cells=tr.querySelectorAll('td');
      var customer=cells[customerIdx] ? cells[customerIdx].textContent.trim() : '';
      var show = norm(customer)!==norm(titleText) && allowedCustomer(customer) && (selectedCustomer === 'ALL' || norm(customer) === selectedCustomer);
      tr.style.display=show ? '' : 'none';
      if(show) visible++;
    });
    title.textContent = titleText + ' (' + visible + ')';
    var old=section.querySelector('.nightshift-customer-summary');
    if(old) old.remove();
    var summary=document.createElement('div');
    summary.className='nightshift-customer-summary';
    var allChip=document.createElement('button');
    allChip.type='button';
    allChip.className='customer-count-chip' + (selectedCustomer === 'ALL' ? ' active' : '');
    allChip.dataset.customer='ALL';
    allChip.innerHTML='ALL <b>(' + Object.keys(counts).reduce(function(sum,name){ return sum + counts[name]; },0) + ')</b>';
    summary.appendChild(allChip);
    Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a] || a.localeCompare(b); }).forEach(function(name){
      var chip=document.createElement('span');
      chip=document.createElement('button');
      chip.type='button';
      chip.className='customer-count-chip' + (norm(name) === selectedCustomer ? ' active' : '');
      chip.dataset.customer=norm(name);
      chip.innerHTML = name + ' <b>(' + counts[name] + ')</b>';
      summary.appendChild(chip);
    });
    var heading=section.querySelector('.section-heading') || title.parentElement;
    if(heading && heading.parentNode){ heading.parentNode.insertBefore(summary, heading.nextSibling); }
    var caption=section.querySelector('.summary-caption');
    if(caption) caption.textContent=visible + ' equipment';
  }
  document.addEventListener('click', function(e){
    var chip=e.target && e.target.closest ? e.target.closest('.nightshift-customer-summary .customer-count-chip') : null;
    if(!chip) return;
    selectedCustomer = chip.dataset.customer || 'ALL';
    setTimeout(applyNightShiftCustomerSummary,0);
  }, true);
  applyNightShiftCustomerSummary();
  document.addEventListener('click', function(){ setTimeout(applyNightShiftCustomerSummary,300); }, true);
  setInterval(applyNightShiftCustomerSummary,1000);
})();
</script>

<script id="nightshift-sort-oldest-newest">
(function(){
  if (window.__nightShiftSortOldestNewestV2) return;
  window.__nightShiftSortOldestNewestV2 = true;
  function isNightShift(){ var a=document.querySelector('.report-tab.active'); return a && /Night Shift/i.test(a.textContent||''); }
  function parseTime(v){
    v=String(v||'').trim();
    if(!v || v==='Pending') return Number.MAX_SAFE_INTEGER;
    // Handles: 05/28/2026, 02:55:17 or 05/28/2026 02:55:17 PDT
    var cleaned=v.replace(/\s*PDT\s*$/i,'').replace(',', '');
    var m=cleaned.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
    if(m){
      return new Date(Number(m[3]), Number(m[1])-1, Number(m[2]), Number(m[4]), Number(m[5]), Number(m[6]||0)).getTime();
    }
    var d=new Date(cleaned);
    return isNaN(d.getTime()) ? Number.MAX_SAFE_INTEGER : d.getTime();
  }
  function sortNightShiftOldestFirst(){
    if(!isNightShift()) return;
    var title=Array.from(document.querySelectorAll('h2,h3')).find(function(h){ return /Night Shift.*Full to Offload Containers|Night Shift.*FULL Trailers.*Containers/i.test(h.textContent||''); });
    if(!title) return;
    var section=title;
    while(section && section!==document.body){ if(section.querySelector && section.querySelector('table')) break; section=section.parentElement; }
    if(!section || section===document.body) return;
    var table=section.querySelector('table'); if(!table) return;
    var headers=Array.from(table.querySelectorAll('thead th'));
    var idx=headers.findIndex(function(th){ return /GATE CHECK-IN TIME|CHECK-IN|CHECK IN/i.test(th.textContent||''); });
    if(idx<0) return;
    var tbody=table.querySelector('tbody'); if(!tbody) return;
    var rows=Array.from(tbody.querySelectorAll('tr'));
    rows.sort(function(a,b){
      var av=a.querySelectorAll('td')[idx]?.textContent || '';
      var bv=b.querySelectorAll('td')[idx]?.textContent || '';
      return parseTime(av)-parseTime(bv);
    });
    rows.forEach(function(tr){ tbody.appendChild(tr); });
  }
  sortNightShiftOldestFirst();
  document.addEventListener('click', function(){ setTimeout(sortNightShiftOldestFirst,350); }, true);
  setInterval(sortNightShiftOldestFirst,1000);
})();
</script>
